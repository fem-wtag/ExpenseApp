<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Persistent Expense Tracker</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Application Header -->
    <header class="app-header">
      <div class="header-container">
        <h1><i class="fa-solid fa-wallet text-accent"></i> Expense Tracker</h1>
        <p>
          Manage your personal finances efficiently with real-time tracking and
          analytics.
        </p>
      </div>
    </header>

    <!-- Main Application Header -->
    <main class="main-container">
      <!-- Total Balance Section -->
      <section class="summary-section grid-4">
        <div class="card summary-card border-left-primary">
          <div class="summary-info">
            <span class="summary-label">Total Expenses</span>
            <h2 id="total-balance" class="summary-amount">$0.00</h2>
          </div>
          <div class="summary-icon bg-primary-light">
            <i class="fa-solid fa-dollar-sign text-primary"></i>
          </div>
        </div>
      </section>

      <!-- Form & Analytics/List -->
      <div class="content-grid">
        <!-- Column 1: Add Expense Form & Quick Actions -->
        <section class="sidebar-column">
          <div class="card">
            <div class="card-header">
              <h3><i class="fa-solid fa-plus-circle"></i> Add New Expense</h3>
            </div>
            <form id="expense-form" class="expense-form" novalidate>
              <!-- Name Input -->
              <div class="form-group">
                <label for="expense-name"
                  >Expense Name <span class="required">*</span></label
                >
                <div class="input-wrapper">
                  <i class="fa-solid fa-tag input-icon"></i>
                  <input
                    type="text"
                    id="expense-name"
                    placeholder="e.g., Grocery Shopping"
                    required
                  />
                </div>
                <small class="error-message" id="name-error"></small>
              </div>

              <!-- Amount Input -->
              <div class="form-group">
                <label for="expense-amount"
                  >Amount ($) <span class="required">*</span></label
                >
                <div class="input-wrapper">
                  <i class="fa-solid fa-dollar-sign input-icon"></i>
                  <input
                    type="number"
                    id="expense-amount"
                    placeholder="0.00"
                    step="0.01"
                    min="0.01"
                    required
                  />
                </div>
                <small class="error-message" id="amount-error"></small>
              </div>

              <!-- Category Input -->
              <div class="form-group">
                <label for="expense-category"
                  >Category <span class="required">*</span></label
                >
                <div class="input-wrapper">
                  <i class="fa-solid fa-folder input-icon"></i>
                  <select id="expense-category" required>
                    <option value="" disabled selected>
                      Select a category
                    </option>
                    <option value="Food & Dining">Food & Dining</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Utilities & Bills">Utilities & Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
                <small class="error-message" id="category-error"></small>
              </div>

              <button type="submit" class="btn btn-primary btn-block">
                <i class="fa-solid fa-plus"></i> Add Expense
              </button>
            </form>
          </div>
        </section>

        <!-- Column 2: Expense Table-->
        <section class="main-column">
          <!-- Expense History Table -->
          <div class="card mt-1">
            <div class="card-header header-with-controls">
              <h3><i class="fa-solid fa-list-check"></i> Expense History</h3>
            </div>
            <!-- Responsive Table Container -->
            <div class="table-wrapper">
              <table class="expense-table">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th class="text-right">Amount</th>
                    <th class="text-center">Action</th>
                  </tr>
                </thead>
                <tbody id="expense-list-tbody">
                  <!-- Dynamically rendered via JS UI Module-->
                </tbody>
              </table>

              <!-- Empty State Display -->
              <div id="empty-state" class="empty-state hidden">
                <i class="fa-solid fa-folder-open empty-icon"></i>
                <p class="empty-title">No Expenses Found</p>
                <p class="empty-subtitle">
                  Add a new record or adjust your filter choices.
                </p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Entry Point JS Module-->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
